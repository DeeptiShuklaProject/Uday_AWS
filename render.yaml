# Render blueprint — React masterclass web service (Docker runtime).
# The Postgres instance already exists, so DATABASE_URL is filled manually:
# paste the Internal Database URL when prompted during the Blueprint deploy
# (or later in the service's Environment tab).
services:
  - type: web
    name: aws-masterclass
    runtime: docker
    dockerfilePath: ./Dockerfile.react
    region: ohio
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
